<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Umbrella</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;cursor:none}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
'use strict';
/* =====================================================================
   ONE UMBRELLA — a 20 second silent film, drawn procedurally.
   Palette: black, crimson, teal, white. Everything is generated here.
   ===================================================================== */
const W=1600,H=900,LOOP=20,BAR=54;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const mk=()=>document.createElement('canvas');
const reflC=mk(),rctx=reflC.getContext('2d');
const bufC=mk(),bctx=bufC.getContext('2d');
const distC=mk(),dctx=distC.getContext('2d');
const finishC=mk();let finishReady=false;
let distKey='';
let S=1,PW=W,PH=H;
let QUAL=1;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,1.5)*QUAL;
  const s=Math.min(innerWidth/W,innerHeight/H);
  let pw=Math.round(W*s*dpr); if(pw>1920)pw=1920; if(pw<320)pw=320;
  S=pw/W; PW=pw; PH=Math.round(H*S);
  for(const c of [cv,reflC,bufC,distC,finishC]){c.width=PW;c.height=PH;}distKey='';finishReady=false;
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
addEventListener('resize',resize); resize();

/* ---------- palette & math ---------- */
const INK=[9,10,12],RED=[198,26,46],TEAL=[26,150,146],WHITE=[240,234,220];
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a<0?0:a>1?1:a})`;
const mix=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
const HAZE=mix(INK,TEAL,0.30);
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,k)=>a+(b-a)*k;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const ss=(a,b,x)=>sm((x-a)/(b-a));
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const fract=x=>x-Math.floor(x);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(i,j=0)=>fract(Math.sin(i*127.1+j*311.7)*43758.5453);
const noise1=x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1};

/* slow-motion clock: the world slows while their eyes meet */
const spd=t=>1-0.84*ss(4.32,4.62,t)*(1-ss(5.3,5.62,t));
const CLK=new Float32Array(2002);
for(let i=1;i<=2001;i++)CLK[i]=CLK[i-1]+spd((i-0.5)*0.01)*0.01;
function clock(t){const f=clamp(t,0,20)*100,i=Math.min(2000,Math.floor(f));return CLK[i]+(CLK[i+1]-CLK[i])*(f-i)}

/* ---------- sprites & textures ---------- */
function glowSprite(c){const s=mk();s.width=s.height=128;const g=s.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,rgba(c,1));gr.addColorStop(0.22,rgba(c,0.55));gr.addColorStop(0.55,rgba(c,0.14));gr.addColorStop(1,rgba(c,0));g.fillStyle=gr;g.fillRect(0,0,128,128);return s}
function bokehSprite(c){const s=mk();s.width=s.height=128;const g=s.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,62);gr.addColorStop(0,rgba(c,0.42));gr.addColorStop(0.72,rgba(c,0.36));gr.addColorStop(0.9,rgba(c,0.55));gr.addColorStop(1,rgba(c,0));g.fillStyle=gr;g.fillRect(0,0,128,128);return s}
const GL={r:glowSprite(RED),t:glowSprite(TEAL),w:glowSprite(WHITE)};
const BK={r:bokehSprite(RED),t:bokehSprite(TEAL),w:bokehSprite(WHITE)};
function glow(c,sp,x,y,rx,ry,a){if(a<=0.004||rx<=0)return;ry=ry??rx;const ga=c.globalAlpha,go=c.globalCompositeOperation;c.globalCompositeOperation='lighter';c.globalAlpha=ga*Math.min(a,1);c.drawImage(sp,x-rx,y-ry,rx*2,ry*2);c.globalAlpha=ga;c.globalCompositeOperation=go}

const grainC=mk();grainC.width=grainC.height=256;
{const g=grainC.getContext('2d'),id=g.createImageData(256,256),r=rng(5);for(let i=0;i<id.data.length;i+=4){const v=r(),w=v>0.5,a=Math.pow(Math.abs(v-0.5)*2,2.4)*90;id.data[i]=id.data[i+1]=id.data[i+2]=w?236:0;id.data[i+3]=a}g.putImageData(id,0,0)}
let grainPat=null;

function capsule(g,x1,y1,x2,y2,r){const a=Math.atan2(y2-y1,x2-x1),h=Math.PI/2;g.moveTo(x1+Math.cos(a-h)*r,y1+Math.sin(a-h)*r);g.lineTo(x2+Math.cos(a-h)*r,y2+Math.sin(a-h)*r);g.arc(x2,y2,r,a-h,a+h,false);g.lineTo(x1+Math.cos(a+h)*r,y1+Math.sin(a+h)*r);g.arc(x1,y1,r,a+h,a+3*h,false);g.closePath()}
function lens(c,x1,y1,x2,y2,w){const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1,nx=-dy/l*w,ny=dx/l*w;c.moveTo(x1,y1);c.quadraticCurveTo(mx+nx,my+ny,x2,y2);c.quadraticCurveTo(mx-nx,my-ny,x1,y1)}

/* the block itself: wood grain, ink blotches, paper fibre, scratches */
const paperC=mk();paperC.width=1024;paperC.height=576;
{const g=paperC.getContext('2d'),r=rng(7);
 for(let i=0;i<80;i++){g.beginPath();let y=r()*576;g.moveTo(0,y);for(let x=0;x<=1024;x+=24){y+=(r()-0.5)*2.4;g.lineTo(x,y+Math.sin(x*0.008+i)*5)}g.strokeStyle=`rgba(240,234,220,${0.010+r()*0.02})`;g.lineWidth=0.5+r()*1.8;g.stroke()}
 for(let i=0;i<300;i++){g.fillStyle=`rgba(0,0,0,${0.03+r()*0.07})`;g.beginPath();g.ellipse(r()*1024,r()*576,3+r()*44,2+r()*20,r()*3,0,7);g.fill()}
 for(let i=0;i<1100;i++){g.fillStyle=`rgba(240,234,220,${0.02+r()*0.07})`;g.fillRect(r()*1024,r()*576,r()*1.6+0.4,r()*1.6+0.4)}
 for(let i=0;i<140;i++){g.strokeStyle=`rgba(240,234,220,${0.02+r()*0.04})`;g.lineWidth=0.5;g.beginPath();const x=r()*1024,y=r()*576;g.moveTo(x,y);g.quadraticCurveTo(x+(r()-.5)*24,y+(r()-.5)*24,x+(r()-.5)*36,y+(r()-.5)*36);g.stroke()}
}
/* carved gouge marks for skies */
const gougeC=mk();gougeC.width=1600;gougeC.height=600;
{const g=gougeC.getContext('2d'),r=rng(11);for(let i=0;i<1100;i++){const x=r()*1600,y=r()*600,L=8+r()*70,a=(r()-0.5)*0.35+Math.sin(x*0.004)*0.2;const tl=r()<0.82;g.fillStyle=tl?rgba(TEAL,0.04+r()*0.09):rgba(WHITE,0.02+r()*0.035);g.beginPath();lens(g,x,y,x+Math.cos(a)*L,y+Math.sin(a)*L,0.8+r()*2.4);g.fill()}}
const vigC=mk();vigC.width=800;vigC.height=450;
{const g=vigC.getContext('2d'),gr=g.createRadialGradient(400,225,120,400,225,520);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(0.6,'rgba(0,0,0,0.28)');gr.addColorStop(1,'rgba(0,0,0,0.85)');g.fillStyle=gr;g.fillRect(0,0,800,450)}

/* ---------- path helpers ---------- */
function poly(c,p){c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);c.closePath()}
function smoothPath(c,p){const n=p.length;c.moveTo((p[n-1][0]+p[0][0])/2,(p[n-1][1]+p[0][1])/2);for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}c.closePath()}
function crPath(c,p){const n=p.length;c.moveTo(p[0][0],p[0][1]);for(let i=0;i<n;i++){const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];c.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1])}c.closePath()}
/* rim light: fill a shape, light crescents on its front and back edges */
function rimFill(c,build,ink,rf,rb,kf,kb,ky=0.3){
  c.save();c.beginPath();build(c);c.clip();
  if(rb){c.fillStyle=rgba(rb.c,rb.a);c.fillRect(-4000,-4000,8000,8000);c.save();c.translate(kb,0);c.beginPath();build(c);c.restore();c.clip()}
  if(rf){c.fillStyle=rgba(rf.c,rf.a);c.fillRect(-4000,-4000,8000,8000)}
  c.translate(rf?-kf:0,rf?kf*ky:0);c.beginPath();build(c);c.fillStyle=rgba(ink);c.fill();
  c.restore();
}
function clipOutside(c,pts){c.beginPath();c.rect(-200,-200,W+400,H+400);c.moveTo(pts[0][0],pts[0][1]);for(let i=pts.length-1;i>0;i--)c.lineTo(pts[i][0],pts[i][1]);c.closePath();c.clip('evenodd')}

/* ---------- rain, ripples, drips ---------- */
function rainLayer(c,o){
  const r=rng(o.seed),a=o.ang||0,dx=Math.sin(a),dy=Math.cos(a);
  const x0=o.x0||0,y0=o.y0??0,w=o.w||W,h=o.h||H,L=o.len;
  const span=h+L*2,slope=dx/dy,extra=Math.abs(slope)*span;
  c.beginPath();
  for(let i=0;i<o.n;i++){
    const lx=r()*(w+extra+80)-40-(slope>0?extra:0),ph=r()*span,sp=o.spd*(0.7+0.6*r()),l=L*(0.5+r()),ww=o.wid*(0.5+r());
    const s=(ph+o.clock*sp)%span,yh=y0-L+s,xh=x0+lx+s*slope;
    const yt=yh-dy*l,xt=xh-dx*l,mx=(xh+xt)/2,my=(yh+yt)/2,nx=dy*ww*0.5,ny=-dx*ww*0.5;
    c.moveTo(xt,yt);c.lineTo(mx+nx,my+ny);c.lineTo(xh,yh);c.lineTo(mx-nx,my-ny);c.closePath();
  }
  c.fillStyle=rgba(o.col||WHITE,o.alpha);c.fill();
}
function ripples(c,o){
  const r=rng(o.seed);c.lineCap='round';
  for(let i=0;i<o.n;i++){
    const per=0.42+r()*0.5,ph=r()*per,q=(o.clock+ph)/per,cyc=Math.floor(q),u=q-cyc;
    const hx=hash(i*13.1+o.seed,cyc),hv=hash(i*7.7+o.seed,cyc+3.3);
    const yy=lerp(o.y0,o.y1,Math.pow(hv,o.skew??1.4)),dk=clamp((yy-o.hy)/(H-o.hy),0.02,1),xx=lerp(o.x0,o.x1,hx);
    const rx=(2+o.size*dk)*(0.15+u*1.1),ry=rx*(o.flat??(0.16+0.22*dk));
    c.strokeStyle=rgba(o.col||WHITE,(1-u)*(o.alpha??0.5)*(0.4+dk*0.6));c.lineWidth=0.6+dk*1.4;
    c.beginPath();c.ellipse(xx,yy,rx,ry,0,0,Math.PI*2);c.stroke();
    if(u<0.16&&dk>0.25){c.beginPath();const cr=(1-u/0.16);for(let k=-1;k<=1;k++){c.moveTo(xx+k*rx*0.4,yy);c.lineTo(xx+k*rx*0.9,yy-dk*14*cr)}c.stroke()}
  }
}
function drips(c,pts,t,len,alpha,col=WHITE){
  c.fillStyle=rgba(col,alpha);c.beginPath();
  for(let i=0;i<pts.length;i++){const p=pts[i];for(let k=0;k<3;k++){const ph=fract(t*(1.3+hash(i,k)*0.6)+hash(i*3,k*7));const y=p[1]+ph*ph*len,l=4+ph*26;lens(c,p[0]+ph*(p[2]||0)*len,y-l,p[0]+ph*(p[2]||0)*len,y,1.4)}}
  c.fill();
}
/* wet-ground reflection: the mirrored layer is sliced and shivered once per frame, then composited */
function strips(c,src,y0,t,amp,step=5){
  const Y0=Math.max(0,Math.floor(y0*S)),key=t+'|'+Y0+'|'+amp;
  if(key!==distKey){distKey=key;
    dctx.setTransform(1,0,0,1,0,0);dctx.clearRect(0,0,PW,PH);
    const st=Math.max(2,Math.round(step*S));
    for(let y=Y0;y<PH;y+=st){const k=(y-Y0)/Math.max(1,PH-Y0),vy=y/S;
      const off=(Math.sin(vy*0.11+t*7.3)*1.1+Math.sin(vy*0.023-t*2.7)*2.6+noise1(vy*0.07+t*3)*1.6)*S*(0.3+k*2.4)*amp;
      dctx.drawImage(src,0,y,PW,st,off,y,PW,st)}}
  c.save();c.setTransform(1,0,0,1,0,0);c.drawImage(distC,0,0);c.restore();
}

/* ---------- figures ---------- */
const PF=[[-0.20,1.55],[-0.26,0.86],[-0.6,0.42],[-0.7,-0.2],[-0.5,-0.82],[-0.02,-1.05],[0.4,-0.88],[0.56,-0.5],[0.6,-0.2],[0.565,-0.08],[0.69,0.24],[0.6,0.35],[0.625,0.46],[0.575,0.53],[0.605,0.6],[0.52,0.7],[0.55,0.85],[0.38,0.97],[0.16,1.02],[0.17,1.55]];
const PM=[[-0.22,1.6],[-0.28,0.9],[-0.62,0.45],[-0.72,-0.2],[-0.5,-0.85],[-0.02,-1.06],[0.42,-0.9],[0.58,-0.52],[0.645,-0.22],[0.585,-0.06],[0.79,0.3],[0.63,0.38],[0.65,0.5],[0.59,0.55],[0.62,0.62],[0.545,0.72],[0.59,0.9],[0.4,1.02],[0.2,1.06],[0.2,1.6]];
const HF=[[-0.05,-1.13],[0.38,-0.99],[0.6,-0.64],[0.585,-0.4],[0.44,-0.5],[0.22,-0.6],[0.0,-0.42],[-0.08,0.1],[-0.1,0.65],[-0.02,0.94],[-0.4,1.0],[-0.74,0.86],[-0.86,0.3],[-0.84,-0.42],[-0.58,-0.96]];
const HM=[[-0.05,-1.14],[0.42,-1.01],[0.63,-0.66],[0.5,-0.6],[0.3,-0.65],[0.08,-0.52],[-0.04,-0.2],[-0.18,0.12],[-0.3,0.5],[-0.6,0.45],[-0.77,-0.15],[-0.62,-0.93]];
function drawHeadP(c,o){
  const prof=o.fem?PF:PM,hair=o.fem?HF:HM;
  if(o.flat){c.fillStyle=rgba(o.flat);c.beginPath();crPath(c,prof);c.fill();c.beginPath();crPath(c,hair);c.fill();return}
  const ink=o.ink||INK,kf=o.kf??0.075,kb=o.kb??0.05;
  rimFill(c,g=>crPath(g,prof),ink,o.rimF,o.rimB,kf,kb);
  rimFill(c,g=>crPath(g,hair),ink,o.rimF?{c:o.rimF.c,a:o.rimF.a*0.7}:null,o.rimB,kf*0.8,kb);
  if(o.detail===false)return;
  const lc=o.lineC||WHITE,eo=o.eye??1,smile=o.smile||0,la=o.lineA??1;
  c.lineCap='round';c.lineJoin='round';
  // wet strands
  c.save();c.beginPath();crPath(c,hair);c.clip();c.strokeStyle=rgba(WHITE,0.06*la);c.lineWidth=0.012;c.beginPath();
  for(let i=0;i<5;i++){const x=-0.68+i*0.11;c.moveTo(x+0.3,-1.0);c.quadraticCurveTo(x-0.02,-0.4,x-0.04,o.fem?0.95:0.4)}c.stroke();c.restore();
  // eye
  c.strokeStyle=rgba(lc,0.8*la);c.lineWidth=0.024;c.beginPath();
  if(eo>0.2){c.moveTo(0.33,-0.12);c.quadraticCurveTo(0.42,-0.17-0.03*eo,0.5,-0.115);c.stroke();
    c.fillStyle=rgba(WHITE,(o.glint??0.9)*la);c.beginPath();c.ellipse(0.468,-0.112,0.024*eo,0.02*eo,0,0,7);c.fill();
    if(o.fem){c.beginPath();c.moveTo(0.5,-0.118);c.lineTo(0.55,-0.15);c.stroke()}
  }else{c.moveTo(0.33,-0.1);c.quadraticCurveTo(0.42,-0.055,0.51,-0.1);c.stroke();if(o.fem){c.beginPath();c.moveTo(0.49,-0.085);c.lineTo(0.53,-0.06);c.stroke()}}
  // brow
  const br=o.brow||0;c.strokeStyle=rgba(lc,0.32*la);c.lineWidth=0.02;c.beginPath();c.moveTo(0.3,-0.3-br*0.05);c.quadraticCurveTo(0.44,-0.35-br*0.07,0.565,-0.29-br*0.02);c.stroke();
  // mouth
  c.strokeStyle=rgba(lc,0.55*la);c.lineWidth=0.017;c.beginPath();c.moveTo(o.fem?0.57:0.585,0.535);c.quadraticCurveTo(0.52,0.548+smile*0.01,0.465,0.53-smile*0.07);c.stroke();
  if(smile>0.05){c.strokeStyle=rgba(lc,0.28*smile*la);c.beginPath();c.moveTo(0.32,0.18);c.quadraticCurveTo(0.41,0.34,0.49,0.41);c.stroke()}
  if(!o.fem){c.strokeStyle=rgba(lc,0.2*la);c.lineWidth=0.016;c.beginPath();c.moveTo(-0.08,-0.02);c.quadraticCurveTo(-0.22,0.12,-0.1,0.33);c.stroke()}
}
function headAt(c,cx,cy,s,dir,up,o){c.save();c.translate(cx,cy);c.scale(dir*s,s);c.rotate(-up);drawHeadP(c,o);c.restore()}
function xfHead(cx,cy,s,dir,up,px,py){const ca=Math.cos(-up),sa=Math.sin(-up);return[cx+dir*s*(px*ca-py*sa),cy+s*(px*sa+py*ca)]}

function drawUmb(c,u,ink,h){
  const [hx,hy]=u.hand,tl=u.tilt||0,L=u.len||0.52,open=u.open??1;
  const ax=hx+Math.sin(tl)*L,ay=hy-Math.cos(tl)*L;
  const flat=u.flat,big=h>160;
  c.lineCap='round';
  c.strokeStyle=rgba(flat||ink);c.lineWidth=big?0.009:0.016;c.beginPath();c.moveTo(hx,hy+0.035);c.lineTo(ax,ay);c.stroke();
  if(big&&!flat){c.beginPath();c.moveTo(hx,hy+0.03);c.quadraticCurveTo(hx,hy+0.07,hx-0.03,hy+0.06);c.stroke()}
  c.save();c.translate(ax,ay);c.rotate(tl+(u.wob||0));
  if(open<0.35){ // furled
    const l=u.flen||0.62;c.fillStyle=rgba(flat||ink);c.beginPath();c.moveTo(0,-0.03);c.quadraticCurveTo(0.05*open+0.02,l*0.55,0.004,l);c.quadraticCurveTo(-0.05*open-0.02,l*0.55,0,-0.03);c.fill();c.restore();return}
  const R=(u.R||0.32)*open,inv=u.inv||0,hh=0.15*(1-2*inv)*(0.6+0.4*open),n=8;
  const rim=[];for(let i=0;i<=n;i++){const x=-R+2*R*i/n;rim.push([x*(u.sq?1+u.sq:1),hh+(inv>0?Math.sin(i*2.1)*0.03*inv:0)])}
  const build=g=>{g.moveTo(rim[0][0],rim[0][1]);g.quadraticCurveTo(0,-hh*1.05,rim[n][0],rim[n][1]);for(let i=n;i>0;i--){const a=rim[i],b=rim[i-1];g.quadraticCurveTo((a[0]+b[0])/2,(a[1]+b[1])/2-0.03*R/0.32*(1-inv*1.6),b[0],b[1])}g.closePath()};
  if(flat){c.fillStyle=rgba(flat);c.beginPath();build(c);c.fill();c.restore();return}
  const kind=u.kind||'black';
  c.beginPath();build(c);
  if(kind==='clear'){c.fillStyle=rgba(WHITE,0.16);c.fill();c.strokeStyle=rgba(WHITE,0.6);c.lineWidth=big?0.006:0.012;c.stroke()}
  else{c.fillStyle=kind==='teal'?rgba(mix(INK,TEAL,0.55)):rgba(ink);c.fill();c.strokeStyle=rgba(WHITE,0.16);c.lineWidth=big?0.004:0.01;c.beginPath();c.moveTo(rim[0][0],rim[0][1]);c.quadraticCurveTo(0,-hh*1.05,rim[n][0],rim[n][1]);c.stroke()}
  if(h>60){c.strokeStyle=rgba(WHITE,kind==='clear'?0.35:0.14);c.lineWidth=big?0.004:0.009;c.beginPath();for(let i=1;i<n;i++){c.moveTo(0,-hh*0.02);c.quadraticCurveTo(rim[i][0]*0.6,hh*0.05,rim[i][0],rim[i][1])}c.stroke()}

    c.fillStyle=rgba(WHITE,0.45);c.beginPath();for(let i=0;i<60;i++){const x=hash(i,3)*W,y=332+fract(cl*1.8+hash(i,4))*480;lens(c,x,y-14,x,y,1.3)}c.fill()}

/* S11 — the train overhead; she takes his hand */
function shotTrain(c,t){

  bokehBG(c,{seed:111,n:36,t,base:0.14,y0:300,yh:420,amp:0.7});
  // flashes from the passing windows
  const strobe=0.5+0.5*Math.sin(t*52);
  c.save();c.globalCompositeOperation='lighter';
  for(let i=0;i<5;i++){const x=fract(t*2.6+i*0.2)*(W+700)-350;const g=c.createLinearGradient(x-90,0,x+90,0);g.addColorStop(0,rgba(WHITE,0));g.addColorStop(0.5,rgba(WHITE,0.12+0.05*strobe));g.addColorStop(1,rgba(WHITE,0));c.fillStyle=g;c.fillRect(x-90,200,180,H)}

  const dp=[];for(let x=-20;x<W+40;x+=30)dp.push([x,236]);drips(c,dp,lt*1.6,700,0.55);
  // the couple
  const glance=Math.sin(clamp(u/0.45)*Math.PI);
  const reach=eio(clamp((u-0.42)/0.38));
  const mx=640,wx=955,gy=1215,mh=1000,wh=930;
  const meet=[lerp(0.17,0.12,reach),lerp(-0.5,-0.53,reach)];
  // his hand in screen coords
  const hs=[mx+meet[0]*mh,gy+meet[1]*mh];
  // her arm: shoulder→his hand, in her mirrored local space
  const herHand=[-(hs[0]-wx)/wh,(hs[1]-gy)/wh];
  const restH=[0.03,-0.5],hd=[lerp(restH[0],herHand[0]+0.01,reach),lerp(restH[1],herHand[1],reach)];
  const arm2={sh:[0.0,-0.785],el:[lerp(0.0,(hd[0])*0.55,reach),lerp(-0.62,-0.66,reach)],hd};
  drawPersonLit(c,wx,gy,wh,{dir:-1,fem:true,coat:RED,headTilt:lerp(-0.22,0.12,ss(0.25,0.55,u)),eye:lerp(0.45,1,ss(0.25,0.5,u)),glint:0.9,arm2,rimF:{c:TEAL,a:0.85},rimB:{c:WHITE,a:0.4}});
  drawPersonLit(c,mx,gy,mh,{dir:1,headTilt:-0.1,eye:1,glint:0.9,arm2:{sh:[0.0,-0.785],el:[0.06,-0.62],hd:meet},umb:{kind:'black',hand:[-0.04,-0.5],tilt:Math.PI-0.06,open:0.1,len:0.46,flen:0.48},noArm:true,rimF:{c:RED,a:0.75},rimB:{c:TEAL,a:0.55}});
  if(reach>0.9){glow(c,GL.w,hs[0],hs[1],30,30,0.3)}
  rainLayer(c,{seed:113,n:60,ang:0.04,spd:2200,len:120,wid:2.5,alpha:0.2,clock:cl,y0:240,h:H-240});
  c.restore();
}
/* S12 — the kiss, lit by the passing train */
function shotKiss(c,t){
  const lt=t-13.6,u=lt/1.6,cl=clock(t);
  const pass=1-ss(14.8,15.05,t);
  c.save();const z=1+0.05*eio(u);c.translate(810,480);c.scale(z,z);c.translate(-810,-480);
  c.fillStyle=rgba(mix(INK,TEAL,0.08));c.fillRect(-60,-60,W+120,H+120);
  // the lit windows streaming behind them
  c.save();
  const off=(t*2600)%220;
  for(let x=-240+off;x<W+240;x+=220){c.fillStyle=rgba(WHITE,0.5*pass);c.fillRect(x,170,150,330);glow(c,GL.w,x+75,330,200,240,0.25*pass)}
  c.fillStyle=rgba(RED,0.8*pass);c.fillRect(-60,520,W+120,26);
  c.fillStyle=rgba(INK,0.85);c.fillRect(-60,546,W+120,40);
  const tail=ss(14.8,14.95,t)*(1-ss(15.0,15.4,t));const tx=lerp(-200,1900,ss(14.8,15.3,t));glow(c,GL.r,tx,380,420,220,0.7*tail);
  c.restore();
  bridge(c,-60,170,t*600,t,0);
  rainLayer(c,{seed:121,n:180,ang:0.05,spd:1300,len:44,wid:1.2,alpha:0.25,clock:cl,y0:170,h:H-170});
  const lean=eio(clamp((u-0.18)/0.35)),hold=ss(0.25,0.5,u);
  // her
  const wcx=940,wcy=548,ws=168,wup=lerp(0.18,0.3,lean);
  // his head, placed so the lips meet hers
  const herLip=xfHead(wcx,wcy,ws,-1,wup,0.61,0.55);
  const ms=182,mup=lerp(-0.14,-0.3,lean);
  const hisLipL=[0.63,0.55];
  const tmp=xfHead(0,0,ms,1,mup,hisLipL[0],hisLipL[1]);
  const kissX=herLip[0]-tmp[0]-4,kissY=herLip[1]-tmp[1];
  const mcx=lerp(kissX-150,kissX,lean),mcy=lerp(kissY+10,kissY,lean);
  // shoulders
  const shM=g=>{g.moveTo(mcx-360,980);g.quadraticCurveTo(mcx-300,mcy+260,mcx-40,mcy+215);g.quadraticCurveTo(mcx+120,mcy+225,mcx+190,mcy+400);g.lineTo(mcx+250,980);g.closePath()};
  const shW=g=>{g.moveTo(wcx+420,980);g.quadraticCurveTo(wcx+360,wcy+260,wcx+90,wcy+215);g.quadraticCurveTo(wcx-60,wcy+225,wcx-120,wcy+390);g.lineTo(wcx-200,980);g.closePath()};
  rimFill(c,shM,INK,{c:RED,a:0.7},{c:WHITE,a:0.3*pass+0.15},8,6,0.6);
  rimFill(c,shW,RED,{c:TEAL,a:0.8},null,-8,0,0.6);
  c.fillStyle=rgba(INK,0.6);c.beginPath();c.moveTo(wcx-20,wcy+262);c.lineTo(wcx+40,wcy+380);c.lineTo(wcx+80,wcy+258);c.closePath();c.fill();
  const eyeM=lerp(1,0,ss(0.22,0.42,u)),eyeW=lerp(1,0,ss(0.2,0.4,u));
  headAt(c,wcx,wcy,ws,-1,wup,{fem:true,rimF:{c:TEAL,a:0.9},rimB:{c:WHITE,a:0.55*pass+0.2},eye:eyeW,glint:0.9,smile:0.25*(1-hold),kf:0.06});
  headAt(c,mcx,mcy,ms,1,mup,{rimF:{c:RED,a:0.85},rimB:{c:WHITE,a:0.5*pass+0.2},eye:eyeM,glint:0.9,kf:0.06});
  // light sweeping across their faces
  if(pass>0.02){c.save();c.globalCompositeOperation='lighter';const x=fract(t*3.4)*(W+600)-300;const g=c.createLinearGradient(x-120,0,x+120,0);g.addColorStop(0,rgba(WHITE,0));g.addColorStop(0.5,rgba(WHITE,0.13*pass));g.addColorStop(1,rgba(WHITE,0));c.fillStyle=g;c.fillRect(x-120,0,240,H);c.restore()}
  c.restore();
}

const SHOTS=[
  {s:0,e:2.8,f:shotWide},{s:2.8,e:3.9,f:shotHim},{s:3.9,e:4.75,f:shotHer},{s:4.75,e:5.45,f:shotEyes},
  {s:5.45,e:5.95,f:shotSignal},{s:5.95,e:7.75,f:shotSurge},{s:7.75,e:8.9,f:shotShelter},{s:8.9,e:9.6,f:shotHands},
  {s:9.6,e:10.6,f:shotSmile},{s:10.6,e:12.5,f:shotUnderpass},{s:12.5,e:13.6,f:shotTrain},{s:13.6,e:15.2,f:shotKiss},
  {s:15.2,e:20,f:shotWide}
];
function drawShot(c,f,t){c.save();c.setTransform(S,0,0,S,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c0=c;
  c.translate(Math.sin(t*13.7)*0.7,Math.cos(t*9.1)*0.5);f(c,t);c.restore();c0=ctx}

function post(t){
  const c=ctx;c.save();
  if(!finishReady){const g=finishC.getContext('2d');g.clearRect(0,0,PW,PH);g.drawImage(paperC,0,0,PW,PH);g.drawImage(vigC,0,0,PW,PH);finishReady=true}
  c.setTransform(1,0,0,1,0,0);c.drawImage(finishC,0,0);
  if(!grainPat)grainPat=c.createPattern(grainC,'repeat');
  const ox=Math.floor(hash(Math.floor(t*24))*256),oy=Math.floor(hash(Math.floor(t*24),3)*256);
  c.translate(-ox,-oy);c.fillStyle=grainPat;c.globalAlpha=0.55;c.fillRect(ox,oy,PW,PH);c.translate(ox,oy);
  c.globalAlpha=1;c.setTransform(S,0,0,S,0,0);
  const fl=noise1(t*18)*0.025+0.02;c.fillStyle=rgba(INK,fl);c.fillRect(0,0,W,H);
  // a stray scratch now and then
  const sc=Math.floor(t*6);if(hash(sc,9)>0.82){const x=hash(sc,10)*W;c.fillStyle=rgba(WHITE,0.12);c.fillRect(x,0,1.2,H)}
  // breathe across the loop seam
  const dip=0.4*(1-ss(0,0.7,t))+0.4*ss(19.3,20,t);if(dip>0.002){c.fillStyle=rgba(INK,dip);c.fillRect(0,0,W,H)}
  c.fillStyle='#000';c.fillRect(0,0,W,BAR);c.fillRect(0,H-BAR,W,BAR);
  c.restore();
}

function render(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#000';ctx.fillRect(0,0,PW,PH);
  const sh=SHOTS.find(s=>t>=s.s&&t<s.e)||SHOTS[0];
  drawShot(ctx,sh.f,t);
  // dissolve: the kiss melts into the city
  if(t>=15.2&&t<15.7){
    bctx.setTransform(1,0,0,1,0,0);bctx.globalAlpha=1;bctx.globalCompositeOperation='source-over';bctx.fillStyle='#000';bctx.fillRect(0,0,PW,PH);
    drawShot(bctx,shotKiss,t);
    ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1-ss(15.2,15.7,t);ctx.drawImage(bufC,0,0);ctx.restore();
  }
  post(t);
}
let FIX=null;const NOADAPT=/noadapt/.test(location.hash);
const off0=/from=([\d.]+)/.exec(location.hash);
const m=/t=([\d.]+)/.exec(location.hash);if(m)FIX=parseFloat(m[1])%LOOP;
window.__render=(t)=>{FIX=t;render(t)};
const t0=performance.now()-(off0?parseFloat(off0[1])*1000:0);

  requestAnimationFrame(frame)}
