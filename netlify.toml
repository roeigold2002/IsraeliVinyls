[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/data/**"]

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

[context.production.environment]
  VITE_API_BASE_URL = "https://israeli-vinyls-projectv.netlify.app"
  CORS_ALLOWED_ORIGINS = "https://israeli-vinyls-projectv.netlify.app"
  PRODUCTION_SITE_URL = "https://israeli-vinyls-projectv.netlify.app"

[context.deploy-preview.environment]
  CORS_ALLOWED_ORIGINS = "https://israeli-vinyls-projectv.netlify.app,https://deploy-preview--israeli-vinyls-projectv.netlify.app"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
