<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חנות הביניים - חיפוש תקליטים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            direction: rtl;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: #111827;
            color: #e5e7eb;
        }
        .logo-text {
            font-size: 28px;
            font-weight: 700;
        }
        .logo-music { color: #3b82f6; }
        .search-box {
            background-color: #1f2937;
            border: 1px solid #374151;
            padding: 14px 20px;
            border-radius: 24px;
            font-size: 16px;
            color: white;
            width: 100%;
            transition: all 0.2s;
        }
        .search-box:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .result-item {
            padding: 20px 0;
            border-bottom: 1px solid #374151;
        }
        .result-item:hover {
            background-color: rgba(59, 130, 246, 0.05);
            padding-right: 8px;
        }
        .result-title {
            font-size: 18px;
            font-weight: 500;
            color: #3b82f6;
            margin-bottom: 4px;
            text-decoration: none;
            cursor: pointer;
        }
        .result-title:hover {
            text-decoration: underline;
        }
        .result-url {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 6px;
            font-family: monospace;
        }
        .result-description {
            font-size: 14px;
            color: #d1d5db;
            line-height: 1.6;
        }
        .result-meta {
            font-size: 12px;
            color: #9ca3af;
            display: flex;
            gap: 16px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .meta-badge {
            background-color: #374151;
            padding: 4px 10px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .pagination {
            text-align: center;
            padding: 40px 20px;
            margin-top: 30px;
        }
        .pagination-btn {
            padding: 10px 24px;
            margin: 0 8px;
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #3b82f6;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            font-weight: 500;
        }
        .pagination-btn:hover:not(:disabled) {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .result-stats {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        .loading-spinner {
            display: inline-block;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="min-h-screen">
        <!-- Header -->
        <header class="py-6 border-b border-gray-700 sticky top-0 bg-gray-900 z-50">
            <div class="max-w-4xl mx-auto px-4">
                <div class="text-center mb-8">
                    <div class="logo-text mb-6">
                        <span class="logo-music">🎵</span>
                        <span>חנות הביניים</span>
                    </div>
                    <p class="text-gray-400 text-sm">חפשו, השוו מחירים ופתחו ישירות לחנות</p>
                </div>
                
                <!-- Search Bar -->
                <div class="search-container max-w-2xl mx-auto">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="חפשו אומן או אלבום..."
                        class="search-box"
                        autofocus
                    />
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-4xl mx-auto px-4 py-8">
            <!-- Results Stats -->
            <div id="resultStats" class="result-stats hidden"></div>

            <!-- Results Container -->
            <div id="resultsContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>טוען תקליטים...</p>
                </div>
            </div>

            <!-- No Results Message -->
            <div id="noResults" class="no-results hidden">
                <p>לא נמצאו תקליטים התואמים לחיפוש</p>
            </div>

            <!-- Pagination -->
            <div id="paginationContainer" class="pagination hidden">
                <button id="prevBtn" class="pagination-btn">← הקודם</button>
                <span id="pageInfo" class="text-gray-400 text-sm mx-4">עמוד 1 מתוך 1</span>
                <button id="nextBtn" class="pagination-btn">הבא →</button>
            </div>
        </main>

        <!-- Footer -->
        <footer class="border-t border-gray-700 mt-12 py-6 bg-gray-800 text-center">
            <p class="text-gray-500 text-sm">© 2024-2026 חנות הביניים - אגרגטור תקליטי ויניל</p>
        </footer>
    </div>

    <script>
        // State
        const STATE = {
            currentPage: 1,
            perPage: 20,
            totalCount: 0,
            totalPages: 1,
            searchQuery: ''
        };

        // Initialize
        async function init() {
            document.getElementById('searchInput').addEventListener('input', debounce(() => {
                STATE.currentPage = 1;
                performSearch();
            }, 300));

            document.getElementById('prevBtn').addEventListener('click', () => {
                if (STATE.currentPage > 1) {
                    STATE.currentPage--;
                    performSearch();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                if (STATE.currentPage < STATE.totalPages) {
                    STATE.currentPage++;
                    performSearch();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            // Load initial results
            await performSearch();
        }

        // Perform search
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            STATE.searchQuery = query;

            try {
                const params = new URLSearchParams({
                    q: query,
                    page: STATE.currentPage,
                    per_page: STATE.perPage
                });

                const response = await fetch(`/api/search?${params}`);
                const data = await response.json();

                STATE.totalCount = data.total;
                STATE.totalPages = data.total_pages;

                displayResults(data.records);
                updatePagination();
            } catch (error) {
                console.error('Search error:', error);
                document.getElementById('resultsContainer').innerHTML = 
                    '<p class="text-red-400">שגיאה בטעינת נתונים</p>';
            }
        }

        // Display results
        function displayResults(records) {
            const container = document.getElementById('resultsContainer');
            const noResults = document.getElementById('noResults');
            const statsDiv = document.getElementById('resultStats');

            if (records.length === 0) {
                container.innerHTML = '';
                noResults.classList.remove('hidden');
                statsDiv.classList.add('hidden');
                return;
            }

            noResults.classList.add('hidden');
            statsDiv.classList.remove('hidden');

            // Show stats
            const start = (STATE.currentPage - 1) * STATE.perPage + 1;
            const end = Math.min(STATE.currentPage * STATE.perPage, STATE.totalCount);
            statsDiv.textContent = `מוצג ${start}–${end} מתוך ${STATE.totalCount} תוצאות`;

            // Display each result
            container.innerHTML = records.map(record => `
                <div class="result-item">
                    <a href="${record.product_url || record.store_url || '#'}" target="_blank" rel="noopener" class="result-title">
                        ${escapeHtml(record.album || 'Unknown')}
                    </a>
                    
                    <div class="result-url">
                        ${record.store_name}
                    </div>
                    
                    <div class="result-description">
                        ${record.artist ? `<strong>אומן:</strong> ${escapeHtml(record.artist)}<br>` : ''}
                        ${record.price && record.currency ? `<strong>מחיר:</strong> ₪${record.price.toLocaleString()}` : ''}
                    </div>
                    
                    <div class="result-meta">
                        ${record.store_name ? `<span class="meta-badge">🏪 ${escapeHtml(record.store_name)}</span>` : ''}
                        ${record.genre ? `<span class="meta-badge">🎸 ${escapeHtml(record.genre)}</span>` : ''}
                        ${record.year ? `<span class="meta-badge">📅 ${record.year}</span>` : ''}
                        ${record.format ? `<span class="meta-badge">💿 ${escapeHtml(record.format)}</span>` : ''}
                        ${record.condition ? `<span class="meta-badge">✓ ${escapeHtml(record.condition)}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Update pagination
        function updatePagination() {
            const container = document.getElementById('paginationContainer');
            const pageInfo = document.getElementById('pageInfo');

            if (STATE.totalPages > 1) {
                container.classList.remove('hidden');
                pageInfo.textContent = `עמוד ${STATE.currentPage} מתוך ${STATE.totalPages}`;
            } else {
                container.classList.add('hidden');
            }

            document.getElementById('prevBtn').disabled = STATE.currentPage === 1;
            document.getElementById('nextBtn').disabled = STATE.currentPage === STATE.totalPages;
        }

        // Escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Debounce
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func(...args), wait);
            };
        }

        // Start app
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
