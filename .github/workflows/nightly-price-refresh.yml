name: Nightly Price Refresh

on:
  schedule:
    # Runs every night at 02:00 UTC (4 AM Israel time)
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch live prices and stock status from stores
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          node scripts/remediate_prices.cjs \
            --concurrency 60 \
            --timeout-ms 3500 \
            --retries 1 \
            --save-every 500 \
            --refresh-days 30 \
            --max-records 60000
        timeout-minutes: 100

      - name: Rebuild stats
        run: node scripts/rebuild_stats.cjs

      - name: Build search bundle
        run: node scripts/build_search_bundle.cjs

      - name: Verify integrity
        run: |
          node scripts/verify_record_integrity.cjs
          node scripts/verify_api_contract.cjs

      - name: Commit updated price data
        run: |
          git config user.name "Deployment Bot"
          git config user.email "noreply@github.com"
          git add netlify/data/records.json \
                  netlify/data/search_records.json \
                  netlify/data/search_bundle.json \
                  netlify/data/record_integrity.json \
                  netlify/data/database_info.json \
                  netlify/data/snapshot_meta.json \
                  netlify/data/genres.json \
                  netlify/data/stores.json \
                  netlify/data/price_remediation_report.json || true
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: nightly price refresh"
          # Rebase onto any concurrent pushes so the push is fast-forward.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # The Netlify site has no Git integration, so we build the frontend here
      # (data is already finalized + committed above) and deploy via the CLI.
      - name: Check Netlify credentials
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets are missing — data was refreshed and committed, but production was NOT deployed. Add both secrets in the repository settings to restore automatic deploys."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend
        if: steps.netlify.outputs.available == 'true'
        run: npx tsc -b && npx vite build

      # Two-step publish (draft upload + REST restore): the one-shot
      # `netlify deploy --prod` returns 403 Forbidden on this account, while
      # the restore endpoint works. See scripts/netlify_deploy_prod.cjs.
      - name: Deploy to Netlify production
        if: steps.netlify.outputs.available == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_MESSAGE: "Nightly price refresh (${{ github.sha }})"
        run: node scripts/netlify_deploy_prod.cjs

      - name: Fail run if deploy was skipped
        if: steps.netlify.outputs.available == 'false'
        run: exit 1
