name: QA Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  qa-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run QA release gate
        env:
          CI: 'true'
          QA_FAIL_ON_STALE: '1'
        run: npm run qa:gate
